name: Deploy Supabase functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Skipping function deploy because SUPABASE_ACCESS_TOKEN is not configured."
            exit 0
          fi
          supabase functions deploy admin-users --project-ref zxrqfnrfshnvrnvuujmz --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

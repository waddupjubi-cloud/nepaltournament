<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tournament Players Nepal | Esports Teams & Tournaments</title>
  <meta name="description" content="Join Tournament Players Nepal to follow esports tournaments, build your team, track live brackets, and connect with players.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0066cc">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tournament Players Nepal">
  <meta property="og:title" content="Tournament Players Nepal">
  <meta property="og:description" content="Nepal's esports hub for teams, tournaments, live brackets, and player connections.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Tournament Players Nepal">
  <meta name="twitter:description" content="Nepal's esports hub for teams, tournaments, live brackets, and player connections.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://zxrqfnrfshnvrnvuujmz.supabase.co" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.107.0"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/utils.js"></script>
  <script defer src="js/supabaseClient.js"></script>
  <script defer src="js/auth.js"></script>
  <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"WebApplication","name":"Tournament Players Nepal","description":"A live esports platform for Nepal's tournament players, teams, brackets, and staff.","applicationCategory":"GameApplication","operatingSystem":"Any"}
  </script>
</head>
<body data-page="index">
  <main class="auth-page user-auth">
    <canvas id="arenaCanvas" aria-hidden="true"></canvas>
    <div class="auth-kinetic" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>
    <section class="auth-card user-card">
      <div class="auth-topline">
        <div>
          <p class="eyebrow">Tournament Players</p>
          <h1>Enter the arena</h1>
          <p class="auth-subtitle">Nepal's esports home for teams, live brackets, and tournament moments.</p>
        </div>
        <button class="icon-button theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme"></button>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab is-active" type="button" data-auth-tab="login">Login</button>
        <button class="tab" type="button" data-auth-tab="register">Register</button>
      </div>

      <form id="loginForm" class="stack auth-panel">
        <label class="field">
          <input id="loginEmail" type="text" autocomplete="username" required placeholder=" ">
          <span>Email or username</span>
        </label>
        <label class="field">
          <input id="loginPassword" type="password" autocomplete="current-password" required placeholder=" ">
          <span>Password</span>
        </label>
        <button class="primary-button" type="submit">Login</button>
      </form>

      <form id="registerForm" class="stack auth-panel hidden">
        <label class="field">
          <input id="registerName" type="text" autocomplete="name" required placeholder=" ">
          <span>Full name</span>
        </label>
        <label class="field">
          <input id="registerEmail" type="email" autocomplete="email" required placeholder=" ">
          <span>Email</span>
        </label>
        <div class="two-grid">
          <label class="field">
            <input id="registerPassword" type="password" autocomplete="new-password" minlength="8" required placeholder=" ">
            <span>Password</span>
          </label>
          <label class="field">
            <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder=" ">
            <span>Confirm</span>
          </label>
        </div>
        <label class="field">
          <input id="dateOfBirth" type="date" required placeholder=" ">
          <span>Date of birth</span>
        </label>
        <div class="three-grid">
          <label class="field">
            <input id="ign" type="text" placeholder=" ">
            <span>IGN</span>
          </label>
          <label class="field">
            <input id="gameId" type="text" placeholder=" ">
            <span>Game ID</span>
          </label>
          <label class="field">
            <input id="serverId" type="text" placeholder=" ">
            <span>Server ID</span>
          </label>
        </div>
        <label class="check-row">
          <input id="applyPlayer" type="checkbox">
          <span>Apply to become a player immediately</span>
        </label>
        <button class="primary-button" type="submit">Create account</button>
      </form>

      <form id="otpForm" class="stack auth-panel hidden">
        <p class="muted">Enter the 6-digit code sent to your email.</p>
        <label class="field">
          <input id="otpEmail" type="email" required placeholder=" ">
          <span>Email</span>
        </label>
        <label class="field">
          <input id="otpToken" type="text" inputmode="numeric" maxlength="6" required placeholder=" ">
          <span>OTP code</span>
        </label>
        <button class="primary-button" type="submit">Verify email</button>
      </form>

      <p id="authMessage" class="message" role="status"></p>
      <a class="text-link" href="staff.html">Staff login</a>
    </section>
  </main>
</body>
</html>

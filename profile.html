<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Profile | Tournament Players Nepal</title>
  <meta name="description" content="Manage your Tournament Players Nepal profile, player roles, and account details.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0066cc">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://zxrqfnrfshnvrnvuujmz.supabase.co" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.107.0"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/utils.js"></script>
  <script defer src="js/supabaseClient.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/notifications.js"></script>
  <script defer src="js/messages.js"></script>
  <script defer src="js/profile.js"></script>
</head>
<body data-page="profile">
  <header class="top-nav"></header>
  <main class="page-shell">
    <section class="wide-panel">
      <div class="section-heading"><h1>Profile</h1></div>
      <form id="profileForm" class="form-grid" aria-live="polite"></form>
    </section>
    <section class="wide-panel">
      <div class="section-heading"><h2>Appeal to become a player</h2></div>
      <form id="appealForm" class="stack">
        <div class="role-grid" id="preferredRoles"></div>
        <label class="field">
          <textarea id="appealNote" rows="4" placeholder=" "></textarea>
          <span>Why should admins approve you?</span>
        </label>
        <button class="primary-button" type="submit">Submit appeal</button>
      </form>
    </section>
  </main>
  <div id="modalRoot"></div>
</body>
</html>

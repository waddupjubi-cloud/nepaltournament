<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Login | Tournament Players Nepal</title>
  <meta name="description" content="Secure staff access for Tournament Players Nepal.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#09070a">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://zxrqfnrfshnvrnvuujmz.supabase.co" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.107.0"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/utils.js"></script>
  <script defer src="js/supabaseClient.js"></script>
  <script defer src="js/auth.js"></script>
</head>
<body class="staff-surface" data-page="staff">
  <main class="staff-login">
    <canvas id="matrixCanvas" aria-hidden="true"></canvas>
    <section class="auth-card staff-card">
      <div class="auth-topline">
        <div>
          <p class="eyebrow">Staff Console</p>
          <h1>Command center</h1>
        </div>
        <button class="icon-button theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme"></button>
      </div>
      <form id="staffLoginForm" class="stack">
        <label class="field">
          <input id="staffEmail" type="text" autocomplete="username" required placeholder=" ">
          <span>Email or username</span>
        </label>
        <label class="field">
          <input id="staffPassword" type="password" autocomplete="current-password" required placeholder=" ">
          <span>Password</span>
        </label>
        <button class="primary-button" type="submit">Open dashboard</button>
      </form>
      <p id="staffMessage" class="message" role="status"></p>
      <a class="text-link" href="index.html">Back to user login</a>
    </section>
  </main>
</body>
</html>

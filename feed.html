<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tournament Players | Feed</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/utils.js"></script>
  <script defer src="js/supabaseClient.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/notifications.js"></script>
  <script defer src="js/feed.js"></script>
</head>
<body data-page="feed">
  <header class="top-nav"></header>
  <main class="feed-layout">
    <aside class="side-panel">
      <h2>Chats</h2>
      <div id="conversationList" class="list-stack"></div>
    </aside>
    <section class="feed-column">
      <div class="section-heading">
        <h1>Feed</h1>
        <button id="refreshFeed" class="secondary-button" type="button">Refresh</button>
      </div>
      <div id="feedPosts" class="post-list"></div>
    </section>
    <aside class="side-panel profile-summary" id="profileSummary"></aside>
  </main>
  <div id="modalRoot"></div>
</body>
</html>
